[project]
name = "appstore"
version = "1.0.0"
description = "Play-style APK share pages (AppStore)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.27,<1",
  "python-multipart>=0.0.9",
  "Pillow>=10.0.0",
  "pydantic>=2.0,<3",
]

[tool.vercel]
entrypoint = "vercel_entry:app"
